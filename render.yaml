databases:
  - name: diario-de-obra-db
    plan: free
    databaseName: diario_de_obra
    user: diario_de_obra

services:
  - type: web
    name: diario-de-obra-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diario-de-obra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOADS_DIR
        value: uploads
      - key: MS_GRAPH_TENANT_ID
        sync: false
      - key: MS_GRAPH_CLIENT_ID
        sync: false
      - key: MS_GRAPH_CLIENT_SECRET
        sync: false
      - key: MS_GRAPH_USER_UPN
        sync: false
      - key: MS_GRAPH_SHARE_URL
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false

  - type: web
    name: diario-de-obra-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # O Render dá nomes de URL previsíveis (https://<nome-do-serviço>.onrender.com),
      # então já deixamos o valor certo aqui — não precisa preencher na mão.
      - key: VITE_API_URL
        value: https://diario-de-obra-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
