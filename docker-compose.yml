version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diario_de_obra
    ports:
      - "5432:5432"
    volumes:
      - diario_de_obra_db:/var/lib/postgresql/data

volumes:
  diario_de_obra_db:
